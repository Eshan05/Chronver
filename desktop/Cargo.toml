[package]
name = "releasescout-rune"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[[bin]]
name = "chronver-desktop"
path = "src/main.rs"

[features]
console = []

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "9553c9a7d7d1e5e038d14e0b313513e95b4fb8bb", default-features = false, features = ["accessibility", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "9553c9a7d7d1e5e038d14e0b313513e95b4fb8bb", features = ["markdown"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
releasescout-engine.workspace = true
url = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tempfile = "3"
pulldown-cmark = "=0.13.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

